name: OpenCode AI task

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      task_mode:
        description: Initial issue implementation or failed revision retry
        required: true
        default: implementation
        type: choice
        options: [implementation, revision]
      issue_number:
        description: Issue number (implementation mode)
        required: false
        type: string
      pr_number:
        description: Existing PR number (revision retry)
        required: false
        type: string
      comment_id:
        description: Original /ai revise comment ID (revision retry)
        required: false
        type: string
      dry_run:
        description: Run authorisation checks only
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-task:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'ai-task') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/ai revise'))
    uses: r0w4n/central-ai-workflow/.github/workflows/opencode-ai-task.yml@<CENTRAL_RELEASE_SHA>
    with:
      task_mode: ${{ github.event_name == 'issue_comment' && 'revision' || inputs.task_mode || 'implementation' }}
      issue_number: ${{ format('{0}', github.event_name == 'issues' && github.event.issue.number || inputs.issue_number) }}
      pr_number: ${{ format('{0}', github.event_name == 'issue_comment' && github.event.issue.number || inputs.pr_number) }}
      comment_id: ${{ format('{0}', github.event_name == 'issue_comment' && github.event.comment.id || inputs.comment_id) }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      setup: true
      # The agent runs focused checks; consumer PR CI runs the full suite.
      # A validated checkpoint from an interrupted run opens as a draft PR.
    secrets:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
