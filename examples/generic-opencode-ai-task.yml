name: OpenCode AI task

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to check or implement
        required: true
        type: string
      dry_run:
        description: Run authorisation checks only
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-task:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai-task'
    uses: r0w4n/central-ai-workflow/.github/workflows/opencode-ai-task.yml@<CENTRAL_RELEASE_SHA>
    with:
      issue_number: ${{ format('{0}', github.event.issue.number || inputs.issue_number) }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      # If this repository needs project-specific preparation, add a local
      # .github/actions/setup-ai-task/action.yml and opt in here.
      # setup: true
      # draft defaults to true. Set false to publish ready-for-review PRs.
      # draft: false
    secrets:
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      # Optional. Providing both mints a GitHub App installation token for
      # publication; pull requests created with an App token trigger the
      # repository's pull_request workflows without held-for-approval gates.
      # The App must be installed on this repository with contents: write and
      # pull requests: write.
      # APP_ID: ${{ secrets.APP_ID }}
      # APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
